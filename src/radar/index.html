<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>cs-hud Radar</title>
	<link rel="stylesheet" href="/hud/css/vars.css">
	<link rel="stylesheet" href="/radar/index.css">
	<script>
		if (window.self !== window.top || new URLSearchParams(window.location.search).has('embedded')) {
			document.documentElement.classList.add('is-embedded');
		}
	</script>
	<style>
		.is-embedded .buttons { display: none !important; }
		.is-embedded,
		.is-embedded body {
			margin: 0 !important;
			padding: 0 !important;
			width: 100vw !important;
			height: 100vh !important;
			overflow: hidden !important;
			background: #0b0e14 !important;
			display: flex !important;
			align-items: center !important;
			justify-content: center !important;
		}
		.is-embedded #app {
			width: 100% !important;
			height: 100% !important;
			display: flex !important;
			align-items: center !important;
			justify-content: center !important;
			position: relative !important;
		}
		.is-embedded .radar {
			position: relative !important;
			top: 0 !important;
			left: 0 !important;
			right: 0 !important;
			bottom: 0 !important;
			margin: auto !important;
			width: min(95vw, 95vh) !important;
			height: min(95vw, 95vh) !important;
			aspect-ratio: 1 / 1 !important;
		}
	</style>
</head>
<body>
	<div class="buttons">
		<a class="open-config" href="/config" target="_blank">
			Open Config Page
		</a>
	</div>

	<div id="app"></div>
	<script type="module" src="/radar/index.js"></script>
</body>
</html>
