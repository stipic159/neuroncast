name: Eon Production Hardening CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Theme Preflight Validator
      run: npm run theme:validate

    - name: Boot Check Server (Dry-run)
      run: |
        node src/server/index.js --ui-dev-mode &
        SERVER_PID=$!
        sleep 3
        curl -f http://localhost:31982/api/status || exit 1
        kill $SERVER_PID
      shell: bash

    # Playwright smoke tests are kept optional so they don't fail if the full browser binary cache is not pre-installed
    - name: Run Playwright Smoke Tests (Optional)
      run: |
        if [ -d "node_modules/@playwright/test" ]; then
          npx playwright install chromium
          npm run test:smoke
        else
          echo "Playwright not globally cached, skipping integration tests."
        fi
      shell: bash
      continue-on-error: true
